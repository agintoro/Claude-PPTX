<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dual Phase Fermentation — Carousel</title>
  <link rel="stylesheet" href="assets/colors_and_type.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(120% 80% at 50% 0%, #cdc5b6 0%, #bdb5a5 60%, #b2aa99 100%);
      color: var(--driva-ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #root { height: 100%; }

    .stage { height: 100%; display: flex; flex-direction: column; align-items: center; }

    /* top bar */
    .topbar {
      flex: 0 0 auto; width: 100%; display: flex; align-items: center;
      justify-content: center; gap: 14px; padding: 20px 24px 14px;
    }
    .dirseg {
      display: inline-flex; background: rgba(255,255,255,.5);
      border: 1px solid rgba(17,17,17,.10); border-radius: 999px; padding: 4px;
      box-shadow: 0 6px 18px rgba(17,17,17,.08);
    }
    .dirseg button {
      border: 0; background: transparent; cursor: pointer; font-family: inherit;
      font-size: 11.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
      color: var(--driva-muted); padding: 10px 20px; border-radius: 999px;
      transition: background .18s ease, color .18s ease; white-space: nowrap;
    }
    .dirseg button.on { background: var(--driva-ink); color: var(--driva-paper); }

    /* viewer */
    .viewer { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 0; width: 100%; }
    .frameBox {
      position: relative; overflow: hidden; border-radius: 26px;
      box-shadow: 0 40px 90px rgba(17,17,17,.26); background: #f7f3ea;
      touch-action: pan-y; cursor: grab; flex: 0 0 auto;
    }
    .frameBox.dragging { cursor: grabbing; }
    .frame { position: absolute; top: 0; left: 0; }
    .track { display: flex; height: 1350px; will-change: transform; }
    .cell { flex: 0 0 1080px; width: 1080px; height: 1350px; }

    .nav {
      flex: 0 0 auto; width: 56px; height: 56px; border-radius: 999px;
      border: 1px solid rgba(17,17,17,.12); background: rgba(255,255,255,.62);
      color: var(--driva-ink); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(17,17,17,.10); transition: background .16s ease, transform .12s ease;
    }
    .nav:hover { background: #fff; }
    .nav:active { transform: scale(.94); }
    .nav:disabled { opacity: .32; cursor: default; }

    /* dots */
    .dots { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 16px 0 26px; }
    .dotrow { display: flex; gap: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 999px; background: rgba(17,17,17,.22); border: 0; padding: 0; cursor: pointer; transition: width .2s ease, background .2s ease; }
    .dot.on { width: 30px; background: var(--driva-ink); }
    .counter { font-size: 12px; font-weight: 900; letter-spacing: .2em; color: rgba(17,17,17,.55); margin-left: 6px; }

    @media (max-width: 560px) { .nav { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="slides.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "bgTone": "ink",
      "headlineScale": 0.98
    }/*EDITMODE-END*/;

    const LS = 'dpf_carousel_v1';
    function loadState() {
      try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
    }
    function saveState(s) { try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {} }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const init = loadState();
      const [dir, setDir] = useState(init.dir === 'B' ? 'B' : 'A');
      const [idx, setIdx] = useState(Number.isInteger(init.idx) ? Math.min(4, Math.max(0, init.idx)) : 0);
      const [scale, setScale] = useState(0.5);
      const [drag, setDrag] = useState(0);
      const [dragging, setDragging] = useState(false);
      const startX = useRef(0);
      const moved = useRef(false);

      const theme = getTheme(dir, t.bgTone);
      const N = SLIDES.length;

      useEffect(() => { saveState({ dir, idx }); }, [dir, idx]);

      // fit-to-viewport scaling
      useEffect(() => {
        function fit() {
          const availH = window.innerHeight - 210;
          const availW = window.innerWidth - 170;
          const s = Math.min(availH / 1350, availW / 1080, 0.74);
          setScale(s > 0.18 ? s : 0.18);
        }
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      const go = useCallback((n) => setIdx((p) => Math.min(N - 1, Math.max(0, n))), [N]);

      useEffect(() => {
        function key(e) {
          if (e.key === 'ArrowRight') go(idxRef.current + 1);
          else if (e.key === 'ArrowLeft') go(idxRef.current - 1);
        }
        window.addEventListener('keydown', key);
        return () => window.removeEventListener('keydown', key);
      }, [go]);
      const idxRef = useRef(idx);
      idxRef.current = idx;

      // pointer drag
      function onDown(e) {
        startX.current = e.clientX;
        moved.current = false;
        setDragging(true);
        e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
      }
      function onMove(e) {
        if (!dragging) return;
        let dx = (e.clientX - startX.current) / scale;
        if (Math.abs(dx) > 4) moved.current = true;
        // resistance at the ends
        if ((idx === 0 && dx > 0) || (idx === N - 1 && dx < 0)) dx *= 0.32;
        setDrag(dx);
      }
      function onUp() {
        if (!dragging) return;
        setDragging(false);
        const threshold = 150;
        if (drag < -threshold) go(idx + 1);
        else if (drag > threshold) go(idx - 1);
        setDrag(0);
      }

      const boxW = Math.round(1080 * scale);
      const boxH = Math.round(1350 * scale);
      const tx = -idx * 1080 + drag;

      return (
        <div className="stage">
          <div className="topbar">
            <div className="dirseg">
              <button className={dir === 'A' ? 'on' : ''} onClick={() => setDir('A')}>A · Hairline</button>
              <button className={dir === 'B' ? 'on' : ''} onClick={() => setDir('B')}>B · Two-Tone</button>
            </div>
          </div>

          <div className="viewer">
            <button className="nav" onClick={() => go(idx - 1)} disabled={idx === 0} aria-label="Previous">‹</button>

            <div
              className={'frameBox' + (dragging ? ' dragging' : '')}
              style={{ width: boxW, height: boxH }}
              onPointerDown={onDown}
              onPointerMove={onMove}
              onPointerUp={onUp}
              onPointerCancel={onUp}
            >
              <div className="frame" style={{ transform: `scale(${scale})`, transformOrigin: 'top left', width: 1080, height: 1350 }}>
                <div
                  className="track"
                  style={{ transform: `translateX(${tx}px)`, transition: dragging ? 'none' : 'transform .52s cubic-bezier(.22,.61,.36,1)' }}
                >
                  {SLIDES.map((s) => (
                    <div className="cell" key={s.n}>
                      <Slide slide={s} direction={dir} theme={theme} headlineScale={t.headlineScale} />
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <button className="nav" onClick={() => go(idx + 1)} disabled={idx === N - 1} aria-label="Next">›</button>
          </div>

          <div className="dots">
            <div className="dotrow">
              {SLIDES.map((s, i) => (
                <button key={s.n} className={'dot' + (i === idx ? ' on' : '')} onClick={() => go(i)} aria-label={'Slide ' + s.n}></button>
              ))}
            </div>
            <span className="counter">{SLIDES[idx].n} / 05</span>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Surface" />
            <TweakRadio label="Background tone" value={t.bgTone}
              options={['warm', 'paper', 'ink']}
              onChange={(v) => setTweak('bgTone', v)} />
            <TweakSection label="Typography" />
            <TweakSlider label="Headline scale" value={t.headlineScale} min={0.82} max={1.22} step={0.02} unit="×"
              onChange={(v) => setTweak('headlineScale', v)} />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
