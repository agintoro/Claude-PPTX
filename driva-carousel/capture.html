<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVA Slides Capture</title>
<link rel="stylesheet" href="driva-tokens.css">
<link rel="stylesheet" href="carousel.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  .slide-wrapper { display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="carousel-slides.jsx"></script>
<script type="text/babel">
  const slides = [
    { id: 's1', Component: () => <SlideHook /> },
    { id: 's2', Component: () => <SlideThanks /> },
    { id: 's3', Component: () => <SlideSchedule /> },
    { id: 's4', Component: () => <SlideDeadline /> },
    { id: 's5', Component: () => <SlideCta /> },
  ];

  const slideId = new URLSearchParams(location.search).get('slide') || 's1';
  const slide = slides.find(s => s.id === slideId) || slides[0];

  function App() {
    return (
      <div className="slide-wrapper" id="slide-frame">
        <slide.Component />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
